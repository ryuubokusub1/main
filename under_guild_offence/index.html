<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>傭兵シナジー＆合成計算ツール</title>
  <style>
    body { font-family: sans-serif; margin: 20px; background-color: #f9f9f9; color: #333; }
    h2, h3 { border-bottom: 2px solid #0056b3; padding-bottom: 5px; color: #0056b3; }
    .container { display: flex; gap: 20px; flex-wrap: wrap; }
    .panel { flex: 1; min-width: 320px; background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    
    /* テーブル装飾 */
    table { border-collapse: collapse; width: 100%; margin-bottom: 10px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; font-size: 14px; }
    th { background-color: #e9ecef; }
    select { width: 100%; padding: 6px; box-sizing: border-box; }
    
    /* ボタン装飾 */
    .btn { padding: 6px 12px; background: #0056b3; color: white; border: none; border-radius: 4px; cursor: pointer; }
    .btn:hover { background: #003d80; }
    .btn-del { background: #dc3545; padding: 4px 8px; font-size: 12px; }
    .btn-del:hover { background: #bd2130; }

    /* 結果カード */
    .card { background: #f1f3f5; border-left: 4px solid #0056b3; padding: 10px; margin-bottom: 8px; border-radius: 0 4px 4px 0; }
    .card-title { font-weight: bold; font-size: 15px; margin-bottom: 4px; }
    .card-desc { font-size: 13px; color: #555; }
    .badge { display: inline-block; background: #28a745; color: white; border-radius: 10px; padding: 2px 8px; font-size: 11px; margin-left: 6px; }
    .materials-list { font-size: 12px; color: #666; margin-top: 4px; }
  </style>
</head>
<body>

  <h2>傭兵計算システム</h2>

  <div class="container">
    <!-- 左パネル：所持キャラ入力 -->
    <div class="panel">
      <h3>所持キャラクター選択</h3>
      <table>
        <thead>
          <tr>
            <th style="width: 50px;">No</th>
            <th>キャラクター名</th>

          </tr>
        </thead>
        <tbody id="character-table">
          <!-- JSで動的に追加されます -->
        </tbody>
      </table>
      <!--
      <button class="btn" onclick="addRow()">+ キャラクターを追加</button>
      -->
    </div>

<!-- 右パネル：自動計算結果 -->
    <div class="panel">
      <h3>発動シナジー一覧</h3>
      
      <!-- ★ここにチェックボックスを追加 -->
      <div style="margin-bottom: 12px; font-size: 14px;">
        <label style="cursor: pointer; user-select: none;">
          <input type="checkbox" id="include-legendary" onchange="calculate()" checked>
          伝説キャラクターをシナジー計算に含める
        </label>
      </div>

      <div id="synergy-results">
        <p style="color: #888;">キャラクターを選択してください。</p>
      </div>

      <h3>作成可能な合成キャラ</h3>
      <div id="synthesis-results">
        <p style="color: #888;">作成可能な合成レシピはありません。</p>
      </div>
    </div>
  </div>
<!-- 目標シナジー検索パネル -->
      <h3>目標シナジー検索（6体編成）</h3>
      <div style="display: flex; gap: 8px; margin-bottom: 8px;">
        <select id="target-synergy-select" style="flex: 2;">
          <!-- JSでシナジー一覧を挿入 -->
        </select>
        <input type="number" id="target-synergy-count" value="1" min="1" max="6" style="width: 50px;">
        <button class="btn" onclick="addTargetSynergy()">追加</button>
      </div>

      <!-- 設定した目標一覧 -->
      <div id="target-synergies-list" style="margin-bottom: 12px;"></div>

      <button class="btn" onclick="searchCombinations()" style="width: 100%; background: #28a745;">条件を満たす組み合わせを検索</button>

      <!-- 検索結果表示領域 -->
      <div id="search-results" style="margin-top: 12px;"></div>

    const tbody = document.getElementById('character-table');

    // --- 画面初期化 ---
    window.onload = () => {
      // 初期状態で3行追加
      for (let i = 0; i < 6; i++) {
        addRow();
      }
    };

    // --- テーブル行の追加 ---
    function addRow() {
      const rowCount = tbody.children.length + 1;
      const tr = document.createElement('tr');
      
      // キャラ選択用のドロップダウン生成
      let optionsHtml = '<option value="">-- 選択してください --</option>';
      sub1Master.forEach(char => {
        optionsHtml += `<option value="${char.name}">${char.name}</option>`;
      });

      tr.innerHTML = `
        <td>${rowCount}</td>
        <td><select class="char-select" onchange="calculate()">${optionsHtml}</select></td>
      `;
      tbody.appendChild(tr);
      renumberRows();
    }

    // --- テーブル行の削除 ---
    function removeRow(btn) {
//      btn.closest('tr').remove();
//      renumberRows();
//      calculate();
    }

    // --- 行番号の再振り直し ---
    function renumberRows() {
      Array.from(tbody.children).forEach((tr, index) => {
        tr.children[0].innerText = index + 1;
      });
    }

// --- 自動計算ロジック（コア処理） ---
    function calculate() {
      // 1. 選択されたキャラのリストを取得（空欄除外）
      const selects = document.querySelectorAll('.char-select');
      const selectedChars = Array.from(selects)
        .map(s => s.value)
        .filter(val => val !== "");

      // 2. 作成可能な合成先（伝説キャラ）の判定 (Sub2)
      const selectedSet = new Set(selectedChars);
      const availableCrafts = [];

      sub2Master.forEach(recipe => {
        // レシピに必要な素材がすべて揃っているか判定
        const canCraft = recipe.materials.every(mat => selectedSet.has(mat));
        if (canCraft) {
          availableCrafts.push(recipe);
        }
      });

      // 3. シナジー計算対象キャラクターの決定
      // チェックボックスがONなら「直接選択したキャラ」＋「作成可能な伝説キャラ」を対象にする
      const includeLegendary = document.getElementById('include-legendary').checked;
      
      let targetCharNames = [...selectedChars];
      if (includeLegendary) {
        // 作成可能な伝説キャラの名前を追加
        const legendaryNames = availableCrafts.map(c => c.result);
        targetCharNames = targetCharNames.concat(legendaryNames);
      }

      // 4. シナジーの集計
      const synergyCounts = {};
      targetCharNames.forEach(charName => {
        const charData = sub1Master.find(c => c.name === charName);
        if (charData && charData.attributes) {
          charData.attributes.forEach(attr => {
            synergyCounts[attr] = (synergyCounts[attr] || 0) + 1;
          });
        }
      });

      // 5. 発動シナジーの描画
      const synergyContainer = document.getElementById('synergy-results');
      const activeSynergies = Object.keys(synergyCounts);

      if (activeSynergies.length === 0) {
        synergyContainer.innerHTML = '<p style="color: #888;">キャラクターを選択してください。</p>';
      } else {
        let html = '';
        activeSynergies.forEach(synName => {
          const count = synergyCounts[synName];
          const synData = sub4Master.find(s => s.name === synName);
          const effectText = synData ? synData.effect : "効果テキストなし";

          html += `
            <div class="card">
              <div class="card-title">
                ${synName}
                <span class="badge">${count}体</span>
              </div>
              <div class="card-desc">${effectText}</div>
            </div>
          `;
        });
        synergyContainer.innerHTML = html;
      }

      // 6. 合成可能結果の描画
      const synthesisContainer = document.getElementById('synthesis-results');
      if (availableCrafts.length === 0) {
        synthesisContainer.innerHTML = '<p style="color: #888;">作成可能な合成レシピはありません。</p>';
      } else {
        let craftHtml = '';
        availableCrafts.forEach(craft => {
          craftHtml += `
            <div class="card" style="border-left-color: #28a745;">
              <div class="card-title">完成：${craft.result}</div>
              <div class="materials-list">必要素材: ${craft.materials.join(' + ')}</div>
            </div>
          `;
        });
        synthesisContainer.innerHTML = craftHtml;
      }
    }
    // 目標シナジーのリスト保存用
    let targetSynergies = [];

    // 初期化時にドロップダウンへシナジー一覧をセット
    window.addEventListener('DOMContentLoaded', () => {
      const select = document.getElementById('target-synergy-select');
      sub4Master.forEach(syn => {
        const opt = document.createElement('option');
        opt.value = syn.name;
        opt.innerText = syn.name;
        select.appendChild(opt);
      });
    });

    // 目標シナジーの追加
    function addTargetSynergy() {
      const name = document.getElementById('target-synergy-select').value;
      const count = parseInt(document.getElementById('target-synergy-count').value, 10);
      
      if (!name || isNaN(count)) return;

      // 重複チェック
      const existing = targetSynergies.find(t => t.name === name);
      if (existing) {
        existing.count = count;
      } else {
        targetSynergies.push({ name, count });
      }
      renderTargetSynergies();
    }

    // 目標シナジーの削除
    function removeTargetSynergy(name) {
      targetSynergies = targetSynergies.filter(t => t.name !== name);
      renderTargetSynergies();
    }

    // 目標シナジー描画
    function renderTargetSynergies() {
      const container = document.getElementById('target-synergies-list');
      if (targetSynergies.length === 0) {
        container.innerHTML = '<p style="color:#888; font-size:12px;">目標条件が設定されていません</p>';
        return;
      }

      let html = '';
      targetSynergies.forEach(t => {
        html += `
          <span style="display:inline-block; background:#e9ecef; padding:4px 8px; border-radius:4px; font-size:13px; margin-right:4px; margin-bottom:4px;">
            ${t.name} : ${t.count}以上 
            <b style="color:red; cursor:pointer; margin-left:4px;" onclick="removeTargetSynergy('${t.name}')">×</b>
          </span>
        `;
      });
      container.innerHTML = html;
    }

    // 組み合わせ検索処理 (コアロジック)
    function searchCombinations() {
      const resultsContainer = document.getElementById('search-results');
      if (targetSynergies.length === 0) {
        resultsContainer.innerHTML = '<p style="color:red;">目標シナジーを1つ以上追加してください。</p>';
        return;
      }

      // 1. ノーマルキャラの抽出（合成結果に存在しないキャラ）
      const legendarySet = new Set(sub2Master.map(r => r.result));
      const normalChars = sub1Master.filter(c => !legendarySet.has(c.name));

      const includeLegendary = document.getElementById('include-legendary').checked;
      const matchedCombinations = [];

      // 2. 6体の組み合わせを生成（再帰関数）
      function combine(startIndex, currentCombo) {
        if (currentCombo.length === 6) {
          if (checkCondition(currentCombo, includeLegendary)) {
            matchedCombinations.push([...currentCombo]);
          }
          return;
        }

        for (let i = startIndex; i < normalChars.length; i++) {
          currentCombo.push(normalChars[i]);
          combine(i + 1, currentCombo); // 重複なしで選ぶ場合
          currentCombo.pop();
        }
      }

      combine(0, []);

      // 3. 結果の描画
      if (matchedCombinations.length === 0) {
        resultsContainer.innerHTML = '<p style="color:#888;">条件を満たす6体の組み合わせは見つかりませんでした。</p>';
      } else {
        let html = `<p style="font-weight:bold; color:#28a745;">ヒット数: ${matchedCombinations.length} 件</p>`;
        // 件数が多い場合は上位20件程度を表示
        const displayList = matchedCombinations.slice(0, 20);
        
        displayList.forEach((combo, index) => {
          const names = combo.map(c => c.name).join(', ');
          html += `
            <div class="card" style="font-size:13px;">
              <b>パターン ${index + 1}:</b> ${names}
            </div>
          `;
        });

        if (matchedCombinations.length > 20) {
          html += `<p style="font-size:12px; color:#666;">※結果が多いため上位20件を表示しています。</p>`;
        }
        resultsContainer.innerHTML = html;
      }
    }

    // 条件判定用関数
    function checkCondition(combo, includeLegendary) {
      const selectedSet = new Set(combo.map(c => c.name));
      let targetNames = combo.map(c => c.name);

      // 伝説も含める場合は合成可能な伝説キャラを追加
      if (includeLegendary) {
        sub2Master.forEach(recipe => {
          if (recipe.materials.every(mat => selectedSet.has(mat))) {
            targetNames.push(recipe.result);
          }
        });
      }

      // シナジー数の集計
      const counts = {};
      targetNames.forEach(charName => {
        const charData = sub1Master.find(c => c.name === charName);
        if (charData && charData.attributes) {
          charData.attributes.forEach(attr => {
            counts[attr] = (counts[attr] || 0) + 1;
          });
        }
      });

      // 設定した目標シナジーを全て満たしているかチェック
      return targetSynergies.every(target => {
        return (counts[target.name] || 0) >= target.count;
      });
    }
  </script>
